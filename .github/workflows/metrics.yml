name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: header
          config_timezone: Asia/Dhaka
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_skipped: swot, notes-morphe-patches
